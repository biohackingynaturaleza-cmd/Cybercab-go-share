<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07090b">
<title>Cybercab Go Share — share a robotaxi in Austin, pay half</title>
<meta name="description" content="Someone is already going where you are. Share a robotaxi with identity-verified people and pay only for your part of the trip.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%2307090b'/><path d='M7 20h18M11 20V13l4-3h6l3 4v6' stroke='%232fd4e8' stroke-width='2.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/><circle cx='12' cy='22' r='2' fill='%232fd4e8'/><circle cx='22' cy='22' r='2' fill='%232fd4e8'/></svg>">
<link rel="stylesheet" href="/app.css">
</head>
<body>

<div class="avisos" id="avisos" role="status" aria-live="polite"></div>

<div class="app">

  <header>
    <div class="marca">
      <b>Cybercab</b> Go Share <em data-t="marca.zona">Austin</em>
    </div>
    <div class="cabecera-dcha">
      <div class="idiomas" role="group" aria-label="Language">
        <button data-idioma="en">EN</button><button data-idioma="es">ES</button>
      </div>
      <span id="sesion" class="cabecera-dcha"></span>
    </div>
  </header>

  <main>
    <!-- Panel lateral -->
    <div class="panel" id="panel" hidden>
      <!-- Viaje en curso: compartirlo y, si hace falta, el botón de
           emergencia. Lo primero del panel, por encima incluso del ahorro:
           nadie debería tener que pasar por encima del formulario de búsqueda
           para encontrar el botón cuando lo necesita. -->
      <section class="tarjeta oculto" id="viaje-activo">
        <h2 data-t="seg.titulo"></h2>
        <div id="activos"></div>
      </section>

      <!-- Ahorro acumulado: la razón por la que alguien vuelve. -->
      <section class="ahorro oculto" id="caja-ahorro">
        <div class="ahorro-cifra" id="ahorro-cifra">0,00 $</div>
        <div class="ahorro-pie" id="ahorro-pie"></div>
      </section>

      <!-- Suspensión. Lo primero de todo: explica por qué nada más funciona. -->
      <section class="tarjeta oculto" id="caja-suspension"
               style="border-color:var(--peligro);background:#1e1013">
        <h2 style="color:var(--peligro)" data-t="susp.titulo"></h2>
        <p class="tenue" id="suspension-texto"></p>
      </section>

      <!-- Condiciones nuevas: hay que aceptarlas para seguir usando la app. -->
      <section class="tarjeta destaca oculto" id="caja-terminos">
        <h2 data-t="legal.nuevas.t"></h2>
        <p class="tenue" id="terminos-nuevas-d"></p>
        <button class="btn-1 ancho" id="btn-aceptar-terminos" data-t="legal.aceptar"></button>
      </section>

      <!-- Peticiones sin responder: lo único que exige actuar. -->
      <div class="pendientes oculto" id="pendientes" role="button" tabindex="0">
        <span class="contador" id="pendientes-num">0</span>
        <span data-t="pendientes.texto"></span>
      </div>

      <!-- Confianza -->
      <section class="tarjeta destaca oculto" id="confianza">
        <h2><span data-t="confianza.titulo"></span> <span class="nivel nivel-nuevo" id="mi-nivel"></span></h2>
        <p id="mi-nota" style="margin:-4px 0 10px"></p>
        <div class="progreso"><i id="progreso-barra" style="width:0%"></i></div>
        <p id="confianza-texto"></p>
        <ul class="comprobaciones" id="lista-comprobaciones"></ul>
      </section>

      <!-- Buscar / ofrecer -->
      <div class="pestanas oculto" id="modo" role="tablist">
        <button role="tab" id="tab-buscar" aria-selected="true" data-t="modo.buscar"></button>
        <button role="tab" id="tab-ofrecer" aria-selected="false" data-t="modo.ofrecer"></button>
      </div>

      <section class="tarjeta oculto" id="buscar">
        <h2 data-t="buscar.titulo"></h2>
        <div class="campos-2">
          <div class="campo"><label for="origen" data-t="buscar.desde"></label><select id="origen"></select></div>
          <div class="campo"><label for="destino" data-t="buscar.hasta"></label><select id="destino"></select></div>
        </div>
        <div class="campos-2">
          <div class="campo"><label for="cuando" data-t="buscar.cuando"></label><input id="cuando" type="datetime-local"></div>
          <div class="campo">
            <label for="margen" data-t="buscar.margen"></label>
            <select id="margen">
              <option value="30" data-t="buscar.m30"></option>
              <option value="60" selected data-t="buscar.m60"></option>
              <option value="180" data-t="buscar.m180"></option>
              <option value="1440" data-t="buscar.m1440"></option>
            </select>
          </div>
        </div>
        <button class="btn-1 ancho" id="btn-buscar" style="margin-top:4px" data-t="buscar.boton"></button>
        <p class="tenue" style="margin-top:10px" data-t="buscar.nota"></p>
      </section>

      <section class="tarjeta oculto" id="ofrecer">
        <h2 data-t="ofrecer.titulo"></h2>
        <div class="campos-2">
          <div class="campo"><label for="o-origen" data-t="buscar.desde"></label><select id="o-origen"></select></div>
          <div class="campo"><label for="o-destino" data-t="buscar.hasta"></label><select id="o-destino"></select></div>
        </div>
        <div class="campos-2">
          <div class="campo"><label for="o-cuando" data-t="ofrecer.salida"></label><input id="o-cuando" type="datetime-local"></div>
          <div class="campo"><label for="o-vehiculo" data-t="ofrecer.vehiculo"></label><select id="o-vehiculo"></select></div>
        </div>
        <div class="campo">
          <label for="o-tarifa" data-t="ofrecer.tarifa"></label>
          <input id="o-tarifa" type="number" step="0.01" min="0" data-t-ph="ofrecer.tarifa.ph">
          <p class="tenue" style="margin-top:6px" data-t="ofrecer.tarifa.ayuda"></p>
        </div>
        <div class="campo">
          <label for="o-nivel" data-t="ofrecer.exigir"></label>
          <select id="o-nivel">
            <option value="nuevo" data-t="ofrecer.minimo"></option>
            <option value="verificado" data-t="ofrecer.verificado"></option>
            <option value="veterano" data-t="ofrecer.veterano"></option>
          </select>
        </div>
        <div class="nota" id="o-suelo" style="margin-bottom:12px"></div>
        <button class="btn-1 ancho" id="btn-publicar" data-t="ofrecer.boton"></button>
      </section>

      <section class="oculto" id="resultados-caja">
        <h2 id="resultados-titulo">Resultados</h2>
        <div class="resultados" id="resultados"></div>
      </section>

      <!-- Viajes hechos que esperan opinión. Lo primero de la lista porque es
           lo único que se pierde si no se hace hoy: la memoria de cómo fue. -->
      <section class="tarjeta destaca oculto" id="valorar-caja">
        <h2 data-t="val.titulo"></h2>
        <p class="tenue" data-t="val.explica"></p>
        <div id="valorar-lista"></div>
      </section>

      <!-- A quién avisar. Debajo de la confianza porque es lo mismo: cosas que
           haces una vez y te protegen todas las demás. -->
      <section class="tarjeta oculto" id="contactos-caja">
        <h2 data-t="ctc.titulo"></h2>
        <p class="tenue" data-t="ctc.explica"></p>
        <ul class="contactos" id="contactos"></ul>
        <form id="form-contacto">
          <div class="campos-2">
            <div class="campo">
              <label for="ctc-nombre" data-t="ctc.nombre"></label>
              <input id="ctc-nombre" autocomplete="off" data-t-ph="ctc.nombre.ph">
            </div>
            <div class="campo">
              <label for="ctc-email" data-t="ctc.correo"></label>
              <input id="ctc-email" type="email" autocomplete="off">
            </div>
          </div>
          <label class="casilla">
            <input type="checkbox" id="ctc-avisar" checked>
            <span data-t="ctc.avisar"></span>
          </label>
          <button class="btn-2 ancho" id="ctc-anadir" style="margin-top:10px" data-t="ctc.anadir"></button>
        </form>
      </section>

      <section class="oculto" id="incidencias-caja">
        <h2 data-t="inc.titulo"></h2>
        <div class="resultados" id="incidencias"></div>
      </section>

      <section class="oculto" id="mios-caja">
        <h2 data-t="mios.titulo"></h2>
        <div class="resultados" id="mios"></div>
      </section>
    </div>

    <!-- Lienzo -->
    <div class="lienzo">
      <div class="mapa-cab">
        <span id="mapa-titulo" data-t="mapa.area"></span>
        <span id="mapa-nota"></span>
      </div>
      <div class="mapa-caja">
        <svg class="mapa" id="mapa" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet"
             role="img" data-t-aria="mapa.area"></svg>

        <!-- Portada, para quien todavía no ha entrado -->
        <div class="portada" id="portada">
          <div class="portada-texto">
            <span class="sobretitulo" data-t="portada.sobretitulo"></span>
            <h1 data-t-html="portada.titulo"></h1>
            <p class="entradilla" data-t="portada.entradilla"></p>

            <div class="calc" role="group" data-t-aria="portada.ahorro">
              <div class="calc-selectores">
                <div><label for="c-origen" data-t="portada.desde"></label><select id="c-origen"></select></div>
                <span class="calc-flecha" aria-hidden="true">→</span>
                <div><label for="c-destino" data-t="portada.hasta"></label><select id="c-destino"></select></div>
              </div>
              <div class="calc-cifras">
                <div class="cifra solo"><span data-t="portada.solo"></span><b id="c-solo">—</b></div>
                <div class="cifra junto"><span data-t="portada.junto"></span><b id="c-junto">—</b></div>
              </div>
              <div class="calc-pie" id="c-pie"></div>
            </div>

            <div class="portada-cta">
              <button class="btn-1" id="cta-alta" data-t="portada.crear"></button>
              <button class="btn-2" id="cta-entrar" data-t="portada.tengo"></button>
            </div>

            <ol class="pasos">
              <li><span class="num">1</span><div><strong data-t="portada.paso1.t"></strong><p data-t="portada.paso1.d"></p></div></li>
              <li><span class="num">2</span><div><strong data-t="portada.paso2.t"></strong><p data-t="portada.paso2.d"></p></div></li>
              <li><span class="num">3</span><div><strong data-t="portada.paso3.t"></strong><p data-t="portada.paso3.d"></p></div></li>
            </ol>

            <p class="portada-nota" data-t="portada.nota"></p>
            <p class="portada-nota pie-legal">
              <a href="/terminos.html" data-t="legal.terminos"></a> ·
              <a href="/privacidad.html" data-t="legal.privacidad"></a>
            </p>
          </div>

          <!-- El mapa se ve al fondo, a la derecha -->
          <div></div>
        </div>

        <!-- Recuperar contraseña: pedir el enlace, o usarlo si ya se trae. -->
        <div class="portada oculto" id="recuperar" style="grid-template-columns:1fr">
          <div class="portada-texto" style="max-width:440px;margin:0 auto;width:100%">
            <button class="enlace" id="rec-volver" style="margin-bottom:20px" data-t="acceso.volver"></button>
            <h1 style="font-size:30px" id="rec-titulo"></h1>
            <p class="entradilla" style="font-size:15px" id="rec-sub"></p>

            <form id="form-rec-pedir" class="tarjeta">
              <div class="campo">
                <label for="rec-email" data-t="acceso.correo"></label>
                <input id="rec-email" type="email" autocomplete="email" required>
              </div>
              <button class="btn-1 ancho" id="btn-rec-pedir" style="margin-top:6px" data-t="rec.pedir"></button>
            </form>

            <form id="form-rec-cambiar" class="tarjeta oculto">
              <div class="campo">
                <label for="rec-clave" data-t="rec.nueva"></label>
                <input id="rec-clave" type="password" autocomplete="new-password" required
                       minlength="10" data-t-ph="acceso.clave.ph">
              </div>
              <button class="btn-1 ancho" id="btn-rec-cambiar" style="margin-top:6px" data-t="rec.guardar"></button>
            </form>
          </div>
        </div>

        <!-- Acceso -->
        <div class="portada oculto" id="acceso" style="grid-template-columns:1fr">
          <div class="portada-texto" style="max-width:440px;margin:0 auto;width:100%">
            <button class="enlace" id="volver" style="margin-bottom:20px" data-t="acceso.volver"></button>
            <h1 style="font-size:30px" id="acceso-titulo"></h1>
            <p class="entradilla" style="font-size:15px" id="acceso-sub"></p>
            <form id="form-acceso" class="tarjeta">
              <div class="campo" id="campo-nombre">
                <label for="nombre" data-t="acceso.nombre"></label>
                <input id="nombre" autocomplete="name" data-t-ph="acceso.nombre.ph">
              </div>
              <div class="campo">
                <label for="email" data-t="acceso.correo"></label>
                <input id="email" type="email" autocomplete="email" required>
              </div>
              <div class="campo">
                <label for="clave" data-t="acceso.clave"></label>
                <input id="clave" type="password" autocomplete="new-password" required
                       minlength="10" data-t-ph="acceso.clave.ph">
              </div>

              <!-- La aceptación va aquí, junto al botón que crea la cuenta, y
                   sin marcar de antemano: una casilla premarcada no acredita
                   que nadie haya leído nada. -->
              <label class="casilla oculto" id="campo-terminos">
                <input type="checkbox" id="acepta-terminos">
                <span id="texto-terminos"></span>
              </label>

              <button class="btn-1 ancho" id="btn-acceso" style="margin-top:6px">Crear cuenta</button>
            </form>
            <p class="portada-nota">
              <button class="enlace oculto" id="olvide" data-t="acceso.olvide"></button>
            </p>
            <p class="portada-nota">
              <span id="cambiar-texto"></span>
              <button class="enlace" id="cambiar-modo"></button>
            </p>
          </div>
        </div>
      </div>

      <div class="leyenda">
        <span><i style="background:#2fd4e8"></i><span data-t="leyenda.tuyo"></span></span>
        <span><i style="background:#3a5561"></i><span data-t="leyenda.ofrecidas"></span></span>
        <span><i style="background:#3ddc97"></i><span data-t="leyenda.compartido"></span></span>
      </div>
    </div>
  </main>
</div>

<!-- Lo que se ve después de pulsar el botón. Grande, con el número el primero:
     quien llega aquí no está para leer. -->
<div class="modal" id="modal-alerta" hidden role="dialog" aria-modal="true" aria-labelledby="alr-titulo">
  <div class="modal-caja alerta-caja">
    <h2 id="alr-titulo" data-t="alr.titulo"></h2>
    <p id="alr-sub"></p>
    <a class="btn-911" id="alr-911" href="tel:911"><span data-t="alr.llamar"></span> <b id="alr-telefono">911</b></a>
    <p class="tenue" data-t="alr.aviso"></p>
    <ul class="alr-hecho" id="alr-hecho"></ul>
    <div class="modal-pie">
      <button class="btn-2" id="alr-falsa" data-t="alr.falsa"></button>
      <button class="btn-1" id="alr-cerrar" data-t="alr.cerrar"></button>
    </div>
  </div>
</div>

<!-- Denunciar. Va en un diálogo y no en un enlace directo a propósito: hay que
     elegir un motivo y contar qué pasó, y sin las dos cosas la denuncia no se
     puede revisar. -->
<div class="modal" id="modal-denuncia" hidden role="dialog" aria-modal="true" aria-labelledby="den-titulo">
  <form class="modal-caja" id="form-denuncia" novalidate>
    <h2 id="den-titulo" data-t="den.titulo"></h2>
    <p id="den-sub"></p>
    <div class="campo">
      <label for="den-motivo" data-t="den.motivo"></label>
      <select id="den-motivo">
        <option value="seguridad" data-t="den.m.seguridad"></option>
        <option value="identidad" data-t="den.m.identidad"></option>
        <option value="conducta" data-t="den.m.conducta"></option>
        <option value="no_presentado" data-t="den.m.no_presentado"></option>
        <option value="cobro" data-t="den.m.cobro"></option>
        <option value="otra" data-t="den.m.otra"></option>
      </select>
    </div>
    <div class="campo">
      <label for="den-texto" data-t="den.que"></label>
      <textarea id="den-texto" required minlength="10" maxlength="2000" data-t-ph="den.que.ph"></textarea>
    </div>
    <p class="tenue" data-t="den.aviso"></p>
    <div class="modal-pie">
      <button type="button" class="btn-2" id="den-cancelar" data-t="den.cancelar"></button>
      <button type="submit" class="btn-1" id="den-enviar" data-t="den.enviar"></button>
    </div>
  </form>
</div>

<script src="/i18n.js"></script>
<script src="/app.js"></script>
</body>
</html>
